<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808" id="theme-color">
  <title>SHOP SYSTEM™</title>
  <meta name="description" content="SHOP SYSTEM™ — a resource of assets and tools for designers.">

  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("shopsystem-theme") === "light" ? "light" : "dark";
    } catch (_) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=1">
</head>

<body>

  <header class="site-header">

    <a class="logo" href="#" aria-label="SHOP SYSTEM home">
      SHOP SYSTEM™
    </a>

    <label class="search-wrap">
      <span class="visually-hidden">Search resources</span>
      <input id="resource-search" type="search" placeholder="SEARCH" autocomplete="off">
    </label>

    <nav class="category-nav" aria-label="Categories">

      <button class="category-link is-active" data-category="ALL">ALL</button>
      <button class="category-link" data-category="FILTER">FILTER</button>
      <button class="category-link" data-category="ASSETS">ASSETS</button>
      <button class="category-link" data-category="FONTS">FONTS</button>
      <button class="category-link" data-category="MOCKUPS">MOCKUPS</button>

      <a class="category-link" href="mailto:hello@shopsystem.studio">INFO</a>

      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to light theme"
        aria-pressed="false">
      </button>

    </nav>

  </header>

  <main>

    <section class="intro" aria-label="About SHOP SYSTEM">
      <p>
        A RESOURCE OF ASSETS AND TOOLS FOR DESIGNERS.<br>
        CURATED BY JULIEN VAN HAVERE, FOUNDER OF<br>
        SEARCHSYSTEM™. OPEN 24/7.
      </p>
    </section>

    <div class="archive-status">
      <span id="active-category-label">ALL</span>
      <span id="resource-count"></span>
    </div>

    <section
      id="resource-grid"
      class="resource-grid"
      aria-label="Resource archive">
    </section>

    <p id="empty-state" class="empty-state" hidden>
      NO RESULTS FOUND.
    </p>

  </main>

  <!-- LIGHTBOX -->

  <div id="lightbox" class="lightbox" aria-hidden="true">

    <button class="lightbox-close" type="button" aria-label="Close viewer">
      ×
    </button>

    <button class="lightbox-prev" type="button" aria-label="Previous media">
      ←
    </button>

    <div class="lightbox-stage"></div>

    <button class="lightbox-next" type="button" aria-label="Next media">
      →
    </button>

    <div class="lightbox-counter"></div>

  </div>

  <script src="app.js?v=1"></script>

</body>
</html>
